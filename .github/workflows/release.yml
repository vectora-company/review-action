name: Release

# Publicar uma tag vX.Y.Z move a tag major (vX) para o mesmo commit, que é a
# referência que os repositórios usam (`uses: vectora-ltda/review-action@v1`).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  move-major-tag:
    name: Move the major tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Point the major tag at this release
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          major="${TAG%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$major" -m "Release $TAG" "$GITHUB_SHA"
          git push --force origin "refs/tags/$major"
