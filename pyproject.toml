# Ambiente Python só de testes: os testes exercitam scripts/review.sh contra
# um painel simulado. A action em si é bash.

[project]
name = "vectora-review-action-tests"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.15.18"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
